<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litoral Norte SP - Previsão & Windy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabeçalho fixo no topo absoluto, compacto */
        header {
            width: 100%;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .header-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
		
        .btn-home {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .cities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .city-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 2px 4px;
            height: 32px;
        }

        .city-name {
            width: 105px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .city-name i {
            color: #38bdf8;
            font-size: 0.65rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            flex: 1;
            gap: 2px;
            height: 100%;
            min-width: 0;
        }

        .day-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            font-size: 0.62rem;
            padding: 0 1px;
            white-space: nowrap;
            overflow: hidden;
        }

        .day-cell .day-lbl {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.58rem;
            text-transform: uppercase;
        }

        .day-cell i {
            font-size: 0.65rem;
            color: #fbbf24;
        }

        .day-cell .temps {
            font-weight: 600;
            color: #fff;
            font-size: 0.62rem;
        }

        .day-cell .min {
            color: #94a3b8;
            font-size: 0.58rem;
            font-weight: 400;
        }

        /* Container do Windy ocupando todo o restante da tela */
        .windy-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        .windy-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Ajustes finos para celulares muito pequenos */
        @media (max-width: 480px) {
            .city-name {
                width: 85px;
                font-size: 0.62rem;
            }
            .day-cell {
                font-size: 0.55rem;
                gap: 1px;
            }
            .day-cell .day-lbl {
                font-size: 0.52rem;
            }
            .day-cell .temps {
                font-size: 0.58rem;
            }
            .day-cell .min {
                font-size: 0.52rem;
            }
            .header-title {
                font-size: 0.62rem;
            }
            .btn-home {
                font-size: 0.6rem;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho colado no topo -->
    <header>
        <div class="header-left">
            <a href="https://gabrielpereira.net.eu.org" class="btn-home">
                🏠 Página inicial
            </a>
            <div class="header-title">
                <i class="fa-solid fa-location-dot"></i> Previsão Litoral Norte SP — 7 Dias
            </div>
        </div>

        <div class="cities-wrapper">
            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> São Sebastião</div>
                <div class="days-grid" id="seba-grid"></div>
            </div>

            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> Caraguatatuba</div>
                <div class="days-grid" id="caragua-grid"></div>
            </div>

            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> Ilhabela</div>
                <div class="days-grid" id="ilhabela-grid"></div>
            </div>
        </div>
    </header>

    <!-- Windy Embed com as coordenadas originais em São Francisco/São Sebastião -->
    <div class="windy-container">
        <iframe 
            src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=9&overlay=wind&product=ecmwf&level=surface&lat=-23.760&lon=-45.410&detail=true&detailLat=-23.760&detailLon=-45.410&calendar=now&pressure=true&message=true&marker=true" 
            allow="geolocation"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const diasSemana = ['Hoje', 'Amanhã', 'Sáb', 'Dom', 'Seg', 'Ter', 'Qua'];

        function gerarGradeEspremida(containerId, maxs, mins, icones) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `
                    <span class="day-lbl">${diasSemana[i]}</span>
                    <i class="fa-solid ${icones[i]}"></i>
                    <span class="temps">${maxs[i]}°<span class="min">${mins[i]}°</span></span>
                `;
                container.appendChild(cell);
            }
        }

        gerarGradeEspremida('seba-grid', 
            [24, 25, 24, 26, 25, 25, 26], 
            [18, 18, 18, 19, 18, 17, 19], 
            ['fa-cloud-sun', 'fa-cloud-showers-heavy', 'fa-cloud-sun', 'fa-sun', 'fa-cloud-rain', 'fa-cloud-sun', 'fa-sun']
        );

        gerarGradeEspremida('caragua-grid', 
            [23, 25, 24, 27, 25, 25, 27], 
            [17, 18, 18, 19, 17, 17, 19], 
            ['fa-cloud', 'fa-cloud-showers-heavy', 'fa-cloud-sun', 'fa-sun', 'fa-cloud-rain', 'fa-cloud-sun', 'fa-sun']
        );

        gerarGradeEspremida('ilhabela-grid', 
            [25, 25, 24, 26, 25, 25, 27], 
            [20, 20, 20, 21, 20, 19, 21], 
            ['fa-cloud-sun', 'fa-cloud-showers-heavy', 'fa-cloud', 'fa-sun', 'fa-cloud-rain', 'fa-cloud-sun', 'fa-sun']
        );
    </script>

</body>
</html>
