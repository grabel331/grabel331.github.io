<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litoral Norte SP - Clima & Ventos 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            height: calc(100vh - 55px);
        }

        /* Barra de menu lateral customizada para controlar as camadas do Windy */
        .custom-controls {
            width: 240px;
            background-color: #1e293b;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid #334155;
            z-index: 10;
        }

        .custom-controls h3 {
            font-size: 0.95rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .layer-btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .layer-btn:hover {
            background-color: #475569;
            color: #38bdf8;
        }

        .layer-btn.active {
            background-color: #0284c7;
            color: #fff;
            font-weight: 600;
        }

        .external-link {
            margin-top: auto;
            background-color: #0f172a;
            border: 1px solid #334155;
            text-align: center;
        }

        /* Área do Iframe do Windy */
        .map-wrapper {
            flex: 1;
            position: relative;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Litoral Norte SP - Clima & Ventos</h1>
        <span style="font-size: 0.85rem; color: #94a3b8;">São Sebastião / Caraguatatuba</span>
    </header>

    <div class="main-container">
        <!-- Menu Lateral com Atalhos para Camadas -->
        <div class="custom-controls">
            <h3>Camadas de Vento</h3>
            <!-- O parâmetro 'metricWind=km/h' ajusta a unidade para km/h -->
            <button class="layer-btn active" onclick="mudarCamada('wind', this)">💨 Vento & Rajadas</button>
            <button class="layer-btn" onclick="mudarCamada('rain', this)">🌧️ Chuva & Trovoadas</button>
            <button class="layer-btn" onclick="mudarCamada('temp', this)">🌡️ Temperatura</button>
            <button class="layer-btn" onclick="mudarCamada('pressure', this)">📊 Pressão Atmosférica</button>
            <button class="layer-btn" onclick="mudarCamada('waves', this)">🌊 Ondas (Mar)</button>

            <a href="https://www.windy.com/-23.761/-45.410?-23.761,-45.410,11" target="_blank" class="layer-btn external-link">
                🌐 Abrir Windy Completo ↗
            </a>
        </div>

        <!-- Visualizador do Mapa -->
        <div class="map-wrapper">
            <iframe id="windy-iframe" src="https://embed.windy.com/embed2.html?lat=-23.761&lon=-45.410&detailLat=-23.761&detailLon=-45.410&width=650&height=450&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=km/h&metricTemp=°C&radarRange=-1" title="Windy Map"></iframe>
        </div>
    </div>

    <script>
        function mudarCamada(overlayType, elementoBtn) {
            // Remove a classe ativa de todos os botões e adiciona no clicado
            document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
            if(elementoBtn) elementoBtn.classList.add('active');

            // Atualiza o link src do iframe preservando as coordenadas de São Sebastião (-23.761, -45.410)
            const iframe = document.getElementById('windy-iframe');
            const baseUrl = "https://embed.windy.com/embed2.html?";
            const params = new URLSearchParams({
                lat: "-23.761",
                lon: "-45.410",
                detailLat: "-23.761",
                detailLon: "-45.410",
                width: "650",
                height: "450",
                zoom: "11",
                level: "surface",
                overlay: overlayType,
                product: "ecmwf",
                metricWind: "km/h",
                metricTemp: "°C",
                pressure: "true",
                type: "map",
                location: "coordinates",
                detail: "true"
            });

            iframe.src = baseUrl + params.toString();
        }
    </script>
</body>
</html>
