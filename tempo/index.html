<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litoral Norte SP - Previsão & Windy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabeçalho fixo no topo absoluto, compacto */
        header {
            width: 100%;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .header-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
		
        .btn-home {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .cities-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .city-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 2px 4px;
            height: 36px;
        }

        .city-name {
            width: 105px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .city-name i {
            color: #38bdf8;
            font-size: 0.65rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            flex: 1;
            gap: 2px;
            height: 100%;
            min-width: 0;
        }

        .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
            padding: 1px;
            white-space: nowrap;
            overflow: hidden;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .day-cell .day-lbl {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.54rem;
            text-transform: uppercase;
            line-height: 1;
        }

        .day-content {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .day-cell i {
            font-size: 0.58rem;
            color: #fbbf24;
        }

        .day-cell .temps {
            font-weight: 600;
            color: #fff;
            font-size: 0.58rem;
            line-height: 1;
        }

        .day-cell .min {
            color: #94a3b8;
            font-size: 0.52rem;
            font-weight: 400;
        }

        /* Efeito de carregamento animado nos dados */
        .loading-pulse {
            opacity: 0.5;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* Container do Windy ocupando todo o restante da tela */
        .windy-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        .windy-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Ajustes finos para celulares muito pequenos */
        @media (max-width: 480px) {
            .city-name {
                width: 85px;
                font-size: 0.62rem;
            }
            .day-cell .day-lbl {
                font-size: 0.5rem;
            }
            .day-cell .temps {
                font-size: 0.54rem;
            }
            .day-cell .min {
                font-size: 0.48rem;
            }
            .header-title {
                font-size: 0.62rem;
            }
            .btn-home {
                font-size: 0.6rem;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho colado no topo -->
    <header>
        <div class="header-left">
            <a href="https://gabrielpereira.net.eu.org" class="btn-home">
                🏠 Página inicial
            </a>
            <div class="header-title">
                <i class="fa-solid fa-location-dot"></i> Previsão Litoral Norte SP —> prox. 7 Dias 
            </div>
        </div>

        <div class="cities-wrapper">
            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> São Sebá</div>
                <div class="days-grid loading-pulse" id="seba-grid"></div>
            </div>

            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> Caraguá</div>
                <div class="days-grid loading-pulse" id="caragua-grid"></div>
            </div>

            <div class="city-row">
                <div class="city-name"><i class="fa-solid fa-angle-right"></i> Ilhabela</div>
                <div class="days-grid loading-pulse" id="ilhabela-grid"></div>
            </div>
        </div>
    </header>

    <!-- Windy Embed com zoom 11 e as coordenadas -23.815, -45.387 -->
    <div class="windy-container">
        <iframe 
            src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=11&overlay=wind&product=ecmwf&level=surface&lat=-23.815&lon=-45.387&detail=true&detailLat=-23.815&detailLon=-45.387&calendar=now&pressure=true&message=true&marker=true" 
            allow="geolocation"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const diasSemana = ['Hoje', 'Amanhã', 'Sáb', 'Dom', 'Seg', 'Ter', 'Qua'];

        function obterIconeClima(codigoWMO) {
            if (codigoWMO === 0) return 'fa-sun';
            if (codigoWMO >= 1 && codigoWMO <= 3) return 'fa-cloud-sun';
            if (codigoWMO >= 51 && codigoWMO <= 67) return 'fa-cloud-rain';
            if (codigoWMO >= 80 && codigoWMO <= 99) return 'fa-cloud-showers-heavy';
            return 'fa-cloud';
        }

        function formatarDiaSemana(dataStr, index) {
            if (index === 0) return 'Hoje';
            if (index === 1) return 'Amanhã';
            const diasAbv = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const data = new Date(dataStr + 'T00:00:00');
            return diasAbv[data.getDay()];
        }

        function renderizarGrade(containerId, maxs, mins, icones, datas) {
            const container = document.getElementById(containerId);
            container.classList.remove('loading-pulse');
            container.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const labelDia = formatarDiaSemana(datas[i], i);
                cell.innerHTML = `
                    <span class="day-lbl">${labelDia}</span>
                    <div class="day-content">
                        <i class="fa-solid ${icones[i]}"></i>
                        <span class="temps">${Math.round(maxs[i])}°<span class="min">${Math.round(mins[i])}°</span></span>
                    </div>
                `;
                container.appendChild(cell);
            }
        }

        async function buscarPrevisao(lat, lon, containerId) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`;
                const resposta = await fetch(url);
                const dados = await resposta.json();

                const maxs = dados.daily.temperature_2m_max;
                const mins = dados.daily.temperature_2m_min;
                const codigos = dados.daily.weathercode;
                const datas = dados.daily.time;

                const icones = codigos.map(codigo => obterIconeClima(codigo));

                renderizarGrade(containerId, maxs, mins, icones, datas);
            } catch (erro) {
                console.error("Erro ao buscar clima para " + containerId, erro);
            }
        }

        // Coordenadas das cidades mantidas
        buscarPrevisao(-23.760, -45.410, 'seba-grid');     // São Sebastião
        buscarPrevisao(-23.619, -45.411, 'caragua-grid');    // Caraguatatuba
        buscarPrevisao(-23.778, -45.358, 'ilhabela-grid');   // Ilhabela
    </script>
</body>
</html>
