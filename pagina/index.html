<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Global & Litoral</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0b0f19; }
        #map { width: 100vw; height: 100vh; }

        #player-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 12px 22px;
            border-radius: 40px; display: none; align-items: center; gap: 15px;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        #station-info { font-size: 13px; font-weight: 600; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #10b981; }
        audio { height: 32px; outline: none; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="player-bar">
        <span id="station-info">Selecione uma rádio</span>
        <audio id="audio-player" controls autoplay></audio>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.js"></script>

    <script>
        // Centraliza direto em São Sebastião, SP, com zoom ideal para ver a região e o mundo ao afastar
        const map = L.map('map', { center: [-23.7602, -45.4042], zoom: 9, minZoom: 2 });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const markers = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 40 });

        const radioIcon = L.divIcon({
            className: 'custom-radio-icon',
            html: `<div style="width:12px; height:12px; background:#10b981; border:2px solid #fff; border-radius:50%; box-shadow:0 0 8px #10b981;"></div>`,
            iconSize: [12, 12]
        });

        const litoralCoords = {
            'são sebastião': [-23.7602, -45.4042],
            'ilhabela': [-23.7781, -45.3581],
            'caraguatatuba': [-23.6261, -45.4142],
            'ubatuba': [-23.4338, -45.0837]
        };

        const apiServers = [
            'https://all.api.radio-browser.info',
            'https://de1.api.radio-browser.info',
            'https://nl1.api.radio-browser.info'
        ];

        async function carregarRadios() {
            for (let server of apiServers) {
                try {
                    const [resGlobal, resBrasil] = await Promise.all([
                        fetch(`${server}/json/stations/search?has_geo=true&limit=4000&hidebroken=true`),
                        fetch(`${server}/json/stations/search?countrycode=BR&has_geo=true&limit=3000&hidebroken=true`)
                    ]);

                    if (!resGlobal.ok && !resBrasil.ok) continue;

                    const stationsGlobal = resGlobal.ok ? await resGlobal.json() : [];
                    const stationsBrasil = resBrasil.ok ? await resBrasil.json() : [];

                    const mapStations = new Map();
                    [...stationsBrasil, ...stationsGlobal].forEach(s => {
                        if (s.stationuuid && !mapStations.has(s.stationuuid)) {
                            mapStations.set(s.stationuuid, s);
                        }
                    });

                    const markerList = [];

                    mapStations.forEach(station => {
                        let lat = parseFloat(station.geo_lat);
                        let lng = parseFloat(station.geo_long);
                        
                        const cidade = (station.city || '').toLowerCase().trim();
                        const nome = (station.name || '').toLowerCase();

                        let baseCoord = null;
                        if (cidade.includes('sebastião') || nome.includes('são sebastião') || nome.includes('litoral norte')) {
                            baseCoord = litoralCoords['são sebastião'];
                        } else if (cidade.includes('ilhabela') || nome.includes('ilhabela')) {
                            baseCoord = litoralCoords['ilhabela'];
                        } else if (cidade.includes('caraguá') || nome.includes('caraguá')) {
                            baseCoord = litoralCoords['caraguatatuba'];
                        } else if (cidade.includes('ubatuba') || nome.includes('ubatuba')) {
                            baseCoord = litoralCoords['ubatuba'];
                        }

                        if (baseCoord && (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0)) {
                            lat = baseCoord[0] + (Math.random() - 0.5) * 0.02;
                            lng = baseCoord[1] + (Math.random() - 0.5) * 0.02;
                        }

                        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                            const marker = L.marker([lat, lng], { icon: radioIcon });
                            
                            marker.on('click', () => {
                                const streamUrl = station.url_resolved || station.url;
                                if (streamUrl) {
                                    document.getElementById('station-info').innerText = station.name;
                                    const audio = document.getElementById('audio-player');
                                    audio.src = streamUrl;
                                    document.getElementById('player-bar').style.display = 'flex';
                                }
                            });

                            marker.bindTooltip(`<b>${station.name}</b><br>${station.city || station.state || station.country || ''}`, { direction: 'top' });
                            markerList.push(marker);
                        }
                    });

                    if (markerList.length > 0) {
                        markers.addLayers(markerList);
                        map.addLayer(markers);
                        break;
                    }
                } catch (e) {
                    console.warn("Tentando próximo servidor...");
                }
            }
        }

        carregarRadios();
    </script>
</body>
</html>
