<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Map Global</title>
    
    <!-- CSS do Leaflet e do Agrupador de Pontos -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; }
        
        #map { width: 100vw; height: 100vh; background: #0b0f19; }

        /* Player Flutuante Minimalista */
        #player-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 10px 18px;
            border-radius: 40px; display: none; align-items: center; gap: 12px;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(8px);
        }
        #station-info { font-size: 13px; font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #38bdf8; }
        audio { height: 32px; outline: none; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="player-bar">
        <span id="station-info">Selecione uma rádio</span>
        <audio id="audio-player" controls autoplay></audio>
    </div>

    <!-- Scripts do Leaflet e Agrupador -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Inicializa o mapa mundi com estilo escuro (CartoDB Dark Matter)
        const map = L.map('map', {
            center: [20, 0],
            zoom: 3,
            minZoom: 2
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Agrupador de pontos para suportar milhares de rádios sem travar
        const markers = L.markerClusterGroup({
            chunkedLoading: true,
            maxClusterRadius: 40
        });

        // Ícone verde estilizado para os pontos de rádio
        const radioIcon = L.divIcon({
            className: 'custom-radio-icon',
            html: `<div style="width:10px; height:10px; background:#10b981; border-radius:50%; box-shadow:0 0 8px #10b981;"></div>`,
            iconSize: [10, 10]
        });

        // Puxa milhares de rádios com coordenadas válidas da API pública
        fetch('https://de1.api.radio-browser.info/json/stations/search?has_geo=true&limit=10000')
            .then(res => res.json())
            .then(stations => {
                const markerList = [];

                stations.forEach(station => {
                    const lat = parseFloat(station.geo_lat);
                    const lng = parseFloat(station.geo_long);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const marker = L.marker([lat, lng], { icon: radioIcon });
                        
                        marker.on('click', () => {
                            if (station.url_resolved) {
                                document.getElementById('station-info').innerText = station.name;
                                const audio = document.getElementById('audio-player');
                                audio.src = station.url_resolved;
                                document.getElementById('player-bar').style.display = 'flex';
                            }
                        });

                        marker.bindTooltip(`<b>${station.name}</b><br>${station.country || ''}`, { direction: 'top' });
                        markerList.push(marker);
                    }
                });

                markers.addLayers(markerList);
                map.addLayer(markers);
            })
            .catch(err => console.error('Erro ao carregar banco de rádios:', err));
    </script>
</body>
</html>
