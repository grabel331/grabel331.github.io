<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Marble Nightlights - Tela Cheia</title>
    <style>
        /* Remove margens padrão e barras de rolagem da página */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Faz o iframe ocupar 100% da viewport */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://blue-marble.de/nightlights/" 
        title="Blue Marble Nightlights"
        allowfullscreen>
    </iframe>

</body>
</html>
