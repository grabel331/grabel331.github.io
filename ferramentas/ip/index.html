<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Me Localize - Sessão Temporária</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100dvh;
    }
    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #status { font-size: 0.88rem; color: #94a3b8; }
    #map {
      flex: 1;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button id="btn-locate" type="button">Me localize</button>
    <span id="status">Memória limpa. Nada é salvo ao fechar.</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const btnLocate = document.getElementById("btn-locate");

    const map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marker = null;

    function resetState() {
      if (marker) {
        map.removeLayer(marker);
        marker = null;
      }
      map.setView([0, 0], 2);
    }

    // Garante limpeza de variáveis/camadas em memória ao sair da página
    window.addEventListener("pagehide", resetState);

    btnLocate.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusEl.textContent = "Geolocalização não suportada neste navegador.";
        return;
      }

      statusEl.textContent = "Solicitando localização apenas para este clique...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          map.setView([latitude, longitude], 15);

          if (marker) {
            marker.setLatLng([latitude, longitude]);
          } else {
            marker = L.marker([latitude, longitude]).addTo(map);
          }

          marker
            .bindPopup(
              `Sessão atual (não salva)<br>Lat: ${latitude.toFixed(5)}, Lon: ${longitude.toFixed(5)}<br>Precisão: ~${Math.round(accuracy)}m`
            )
            .openPopup();

          statusEl.textContent = `Localizado na sessão atual (${latitude.toFixed(5)}, ${longitude.toFixed(5)}) — ±${Math.round(accuracy)}m`;
        },
        (err) => {
          if (err.code === err.PERMISSION_DENIED) {
            statusEl.textContent = "Permissão de localização negada.";
          } else {
            statusEl.textContent = `Erro ao obter localização: ${err.message}`;
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
