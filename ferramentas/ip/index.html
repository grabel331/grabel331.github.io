<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .bar > * {
      pointer-events: auto;
    }
    .pin-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .pin-btn:hover {
      border-color: #ef4444;
    }
    .exit-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .exit-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button id="btn-locate" class="pin-btn" type="button" aria-label="Localizar">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 22c0 0-6-6.8-6-11.5C6 7.4 8.7 5 12 5s6 2.4 6 5.5C18 15.2 12 22 12 22z" fill="#cbd5e1"/>
        <circle cx="12" cy="8.5" r="5" fill="#ef4444"/>
        <circle cx="10.4" cy="6.8" r="1.5" fill="#fca5a5"/>
      </svg>
    </button>
    <a class="exit-btn" href="https://gabrielpereira.net.eu.org/">Sair</a>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const btnLocate = document.getElementById("btn-locate");

    const map = L.map("map", { zoomControl: false }).setView([0, 0], 2);
    L.control.zoom({ position: "bottomleft" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const redPinIcon = L.divIcon({
      className: "",
      html: `<svg width="32" height="42" viewBox="0 0 32 42" aria-hidden="true">
        <path d="M16 40C16 40 5 27.5 5 18.5C5 15.5 6.3 12.9 8.4 11.1L16 40z" fill="#94a3b8"/>
        <circle cx="16" cy="13" r="10" fill="#ef4444"/>
        <circle cx="12.5" cy="9.5" r="3" fill="#fca5a5"/>
      </svg>`,
      iconSize: [32, 42],
      iconAnchor: [16, 40]
    });

    let marker = null;

    function resetState() {
      if (marker) {
        map.removeLayer(marker);
        marker = null;
      }
      map.setView([0, 0], 2);
    }

    window.addEventListener("pagehide", resetState);

    function requestLocation() {
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 15);

          if (marker) {
            marker.setLatLng([latitude, longitude]);
          } else {
            marker = L.marker([latitude, longitude], { icon: redPinIcon }).addTo(map);
          }
        },
        (err) => {
          console.warn("Geolocalização falhou:", err.code, err.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    btnLocate.addEventListener("click", () => {
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions
          .query({ name: "geolocation" })
          .then((status) => {
            if (status.state === "denied") {
              console.warn("Localização bloqueada nas permissões do navegador/site.");
            }
            requestLocation();
          })
          .catch(() => requestLocation());
      } else {
        requestLocation();
      }
    });
  </script>
</body>
</html>
