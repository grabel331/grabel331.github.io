<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <style>
    :root {
      --bg: #0f141b;
      --panel: #171f2a;
      --panel-2: #1f2a38;
      --text: #e8eef5;
      --muted: #93a3b8;
      --accent: #38bdf8;
      --border: #283546;
      --topbar-h: 48px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: var(--topbar-h);
      width: 100%;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .home-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .topbar-brand {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-stage {
      width: 100%;
      height: calc(100vh - var(--topbar-h));
      padding: 16px 20px 20px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(320px, 400px);
      gap: 24px;
      align-items: center;
      overflow: hidden;
    }

    .player {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    .now-playing {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      min-width: 0;
    }

    .now-playing > div {
      min-width: 0;
      flex: 1;
    }

    .cover {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--panel-2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .title {
      margin: 0 0 4px;
      font-size: 1.05rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .artist {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .progress-area {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 8px;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      touch-action: pan-x;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn.play-main {
      width: 50px;
      height: 50px;
      border-radius: 12px;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .icon-btn.play-main svg {
      width: 20px;
      height: 20px;
    }

    .icon-btn:hover,
    .icon-btn.active-mode {
      border-color: var(--accent);
      color: var(--accent);
    }

    .volume-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .volume-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .tracks-panel {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - var(--topbar-h) - 36px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 12px;
      gap: 12px;
      min-width: 0;
    }

    .library-tools {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      flex-shrink: 0;
    }

    .search-row {
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .search-input,
    .playlist-input,
    .playlist-select,
    .sort-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .search-input {
      flex: 1;
      touch-action: manipulation;
    }

    .sort-select {
      padding: 7px 10px;
      font-size: 0.82rem;
    }

    .search-input:focus,
    .playlist-input:focus,
    .playlist-select:focus,
    .sort-select:focus {
      border-color: var(--accent);
    }

    .view-tabs-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .tab-btn,
    .mini-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn:hover,
    .tab-btn.active,
    .mini-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .playlist-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-create-row,
    .playlist-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .playlist-select {
      flex: 1 1 160px;
      max-width: 100%;
    }

    .playlist-input {
      flex: 1 1 180px;
    }

    .playlist {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 720px;
      border-top: 1px solid var(--border);
    }

    .playlist li {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-width: 0;
      border-left: 3px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .playlist li:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .playlist li.active {
      background: rgba(56, 189, 248, 0.09);
      border-left-color: var(--accent);
    }

    .playlist li.active .track-title {
      color: var(--accent);
      font-weight: 600;
    }

    .now-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .track-info-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .play-track-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .play-track-btn:hover,
    .play-track-btn.is-playing {
      border-color: var(--accent);
      color: var(--accent);
    }

    .fav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.95rem;
      cursor: pointer;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .fav-btn:hover,
    .fav-btn.is-fav {
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.35);
    }

    .add-pl-btn {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .add-pl-btn:hover,
    .add-pl-btn.in-pl {
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty-msg {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      border-bottom: 1px solid var(--border);
    }

    .status {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1em;
      word-break: break-word;
    }

    @media (max-width: 820px) {
      :root {
        --topbar-h: 44px;
      }

      html, body {
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .topbar {
        padding: 0 10px;
      }

      .home-btn {
        padding: 5px 10px;
        font-size: 0.8rem;
      }

      .player-stage {
        height: calc(100dvh - var(--topbar-h));
        min-height: 0;
        padding: 8px 10px 10px;
        gap: 8px;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        align-items: stretch;
        overflow: hidden;
      }

      .player {
        order: -2;
        padding: 10px 12px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .now-playing {
        gap: 10px;
        margin-bottom: 8px;
      }

      .cover {
        width: 44px;
        height: 44px;
        border-radius: 8px;
      }

      .title {
        font-size: 0.92rem;
        margin-bottom: 2px;
      }

      .artist {
        font-size: 0.78rem;
      }

      .progress-area {
        margin-bottom: 8px;
        gap: 6px;
        grid-template-columns: 36px 1fr 36px;
        font-size: 0.74rem;
      }

      .controls {
        gap: 8px;
        margin-bottom: 8px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .icon-btn.play-main {
        width: 44px;
        height: 44px;
      }

      .status {
        margin-top: 4px;
        font-size: 0.74rem;
        min-height: 0;
      }

      .tracks-panel {
        order: -1;
        height: 100%;
        min-height: 0;
        max-height: none;
        overflow: hidden;
        padding: 0;
        gap: 8px;
        align-items: stretch;
      }

      .library-tools {
        padding: 8px 10px;
        gap: 6px;
        border-radius: 10px;
      }

      .search-input,
      .playlist-input,
      .playlist-select,
      .sort-select {
        padding: 6px 8px;
        font-size: 0.84rem;
      }

      .sort-select {
        padding: 5px 8px;
        font-size: 0.76rem;
      }

      .tab-btn,
      .mini-btn {
        padding: 5px 8px;
        font-size: 0.76rem;
      }

      .playlist {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-width: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .track-title {
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.25;
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="home-btn" href="https://gabrielpereira.net.eu.org">🏠 Página inicial</a>
    <span class="topbar-brand">// teste player funcionalidades</span>
  </header>

  <main class="player-stage">
    <section class="tracks-panel" aria-label="Lista de faixas">
      <div class="library-tools">
        <div class="search-row">
          <input
            id="search-input"
            class="search-input"
            type="search"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Buscar música..."
            aria-label="Buscar música"
          />
          <button id="clear-search-btn" class="mini-btn" type="button" title="Limpar busca">Limpar</button>
        </div>

        <div class="view-tabs-row">
          <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Filtros e playlists">
            <button class="tab-btn active" type="button" data-view="all">Todas</button>
            <button class="tab-btn" type="button" data-view="favorites">Favoritos</button>
          </div>

          <select id="sort-select" class="sort-select" aria-label="Ordenar lista de faixas" title="Ordenar lista">
            <option value="default">Ordem: Padrão</option>
            <option value="alpha">Ordem: A–Z</option>
            <option value="numeric">Ordem: Numérica</option>
          </select>
        </div>

        <div class="playlist-bar">
          <div class="playlist-create-row">
            <select id="active-playlist-select" class="playlist-select" aria-label="Selecionar playlist para gerenciar">
              <option value="">Sem playlist ativa</option>
            </select>
            <input
              id="new-playlist-input"
              class="playlist-input"
              type="text"
              placeholder="noLogin playlist salva em localStorage..   "
              aria-label="Nome da nova playlist      "
            />
            <button id="create-playlist-btn" class="mini-btn" type="button">+ Playlist</button>
          </div>

          <div class="playlist-actions-row">
            <button id="rename-playlist-btn" class="mini-btn" type="button" title="Editar/renomear playlist selecionada">Editar</button>
            <button id="delete-playlist-btn" class="mini-btn" type="button" title="Excluir playlist selecionada">Excluir</button>
            <button id="export-playlists-btn" class="mini-btn" type="button" title="Exportar playlists e favoritos em JSON">Exportar</button>
            <button id="import-playlists-btn" class="mini-btn" type="button" title="Importar playlists e favoritos de um JSON">Importar</button>
            <button id="export-m3u-btn" class="mini-btn" type="button" title="Baixar lista M3U com todas as músicas da raiz para o AIMP">M3U</button>
            <input id="import-playlists-file" type="file" accept="application/json,.json" hidden />
          </div>
        </div>
      </div>

      <ul id="playlist" class="playlist"></ul>
    </section>

    <section class="player" aria-label="Controles do player">
      <div class="now-playing">
        <img id="cover" class="cover" alt="Capa da faixa" />
        <div>
          <h1 id="title" class="title">Carregando...</h1>
          <p id="artist" class="artist"></p>
        </div>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-area">
        <span id="current-time">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso da faixa" />
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffle-btn" class="icon-btn" type="button" title="Aleatório" aria-label="Aleatório">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 3h4v4h-2V6.41l-3.59 3.59-1.41-1.41L17.59 5H17V3zM3 6h5.59l3.12 3.12-1.41 1.41L7.76 8H3V6zm14 11h.59l-3.59-3.59 1.41-1.41L19 15.59V14h2v4h-4v-1zM3 16h4.76l7.83-7.83 1.41 1.41L8.59 18H3v-2z"/>
          </svg>
        </button>

        <button id="prev-btn" class="icon-btn" type="button" title="Anterior" aria-label="Anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>

        <button id="play-btn" class="icon-btn play-main" type="button" title="Play / Pause" aria-label="Play / Pause">
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <button id="next-btn" class="icon-btn" type="button" title="Próxima" aria-label="Próxima">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <button id="repeat-btn" class="icon-btn" type="button" title="Repetir" aria-label="Repetir">
          <svg id="repeat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>

      <div class="volume-area">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
      </div>

      <div id="status" class="status"></div>
    </section>
  </main>

  <script id="playlist-data" type="application/json">
  []
  </script>

  <script>
    const GITHUB_OWNER = "0x00g4b";
    const GITHUB_REPO = "musicas";
    const GITHUB_BRANCH = "main";
    const REPO_AUDIO_PATH = "musicas";
    const MUSIC_FOLDER = "https://raw.githubusercontent.com/0x00g4b/musicas/main/musicas/";

    const STORAGE_FAVS_KEY = "gp_player_favorites_v1";
    const STORAGE_PLAYLISTS_KEY = "gp_player_playlists_v1";
    const STORAGE_TRACKS_CACHE_KEY = "gp_player_tracks_cache_v1";
    const TRACKS_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 horas

    const audio = document.getElementById("audio");
    const coverEl = document.getElementById("cover");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const seekEl = document.getElementById("seek");
    const volumeEl = document.getElementById("volume");
    const playlistEl = document.getElementById("playlist");
    const statusEl = document.getElementById("status");

    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const viewTabsEl = document.getElementById("view-tabs");
    const sortSelect = document.getElementById("sort-select");
    const newPlaylistInput = document.getElementById("new-playlist-input");
    const createPlaylistBtn = document.getElementById("create-playlist-btn");
    const activePlaylistSelect = document.getElementById("active-playlist-select");
    const renamePlaylistBtn = document.getElementById("rename-playlist-btn");
    const deletePlaylistBtn = document.getElementById("delete-playlist-btn");
    const exportPlaylistsBtn = document.getElementById("export-playlists-btn");
    const importPlaylistsBtn = document.getElementById("import-playlists-btn");
    const exportM3uBtn = document.getElementById("export-m3u-btn");
    const importPlaylistsFile = document.getElementById("import-playlists-file");

    const playBtn = document.getElementById("play-btn");
    const playIcon = document.getElementById("play-icon");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const repeatBtn = document.getElementById("repeat-btn");
    const repeatIcon = document.getElementById("repeat-icon");

    const placeholderCover =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
          <rect width="120" height="120" fill="#1f2a38"/>
          <circle cx="60" cy="60" r="28" fill="none" stroke="#38bdf8" stroke-width="4"/>
          <circle cx="60" cy="60" r="6" fill="#38bdf8"/>
        </svg>`
      );

    let allTracks = [];
    let visibleTracks = [];
    let queue = [];
    let currentIndex = 0;
    let isShuffle = false;
    let repeatMode = "none";
    let activePlayingFile = null;
    let consecutiveErrorSkips = 0;

    let searchQuery = "";
    let currentView = "all";
    let sortMode = "default";
    let selectedPlaylistName = "";
    let favorites = new Set();
    let playlists = {};

    function loadSavedLibrary() {
      try {
        const favRaw = JSON.parse(localStorage.getItem(STORAGE_FAVS_KEY) || "[]");
        if (Array.isArray(favRaw)) favorites = new Set(favRaw);
      } catch (_) {}

      try {
        const plRaw = JSON.parse(localStorage.getItem(STORAGE_PLAYLISTS_KEY) || "{}");
        if (plRaw && typeof plRaw === "object" && !Array.isArray(plRaw)) {
          playlists = plRaw;
        }
      } catch (_) {}
    }

    function readTracksCache(allowExpired = false) {
      try {
        const raw = localStorage.getItem(STORAGE_TRACKS_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.tracks) || !parsed.tracks.length) return null;
        const isFresh = typeof parsed.savedAt === "number" && (Date.now() - parsed.savedAt) < TRACKS_CACHE_TTL_MS;
        if (isFresh || allowExpired) return parsed.tracks;
      } catch (_) {}
      return null;
    }

    function writeTracksCache(tracks) {
      try {
        if (!Array.isArray(tracks) || !tracks.length) return;
        localStorage.setItem(
          STORAGE_TRACKS_CACHE_KEY,
          JSON.stringify({ savedAt: Date.now(), tracks })
        );
      } catch (_) {}
    }

    function saveFavorites() {
      try {
        localStorage.setItem(STORAGE_FAVS_KEY, JSON.stringify([...favorites]));
      } catch (_) {}
    }

    function savePlaylists() {
      try {
        localStorage.setItem(STORAGE_PLAYLISTS_KEY, JSON.stringify(playlists));
      } catch (_) {}
    }

    function exportPlaylistsData() {
      const payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        playlists,
        favorites: [...favorites]
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "playlists-player.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus("Playlists e favoritos exportados para playlists-player.json.");
    }

    function exportAllTracksM3U() {
      if (!allTracks.length) {
        setStatus("Nenhuma faixa carregada para gerar o M3U.");
        return;
      }

      const lines = ["#EXTM3U"];
      allTracks.forEach((track) => {
        const label = `${track.artist || "Música"} - ${track.title || track.file}`;
        lines.push(`#EXTINF:-1,${label}`);
        lines.push(resolveAudioSrc(track));
      });

      const blob = new Blob([lines.join("\n") + "\n"], { type: "audio/x-mpegurl;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "todas-as-musicas.m3u";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus(`Lista M3U gerada com ${allTracks.length} faixa(s) para o AIMP.`);
    }

    function importPlaylistsFromObject(data) {
      if (!data || typeof data !== "object") {
        throw new Error("Formato JSON inválido.");
      }

      const importedPlaylists =
        data.playlists && typeof data.playlists === "object" && !Array.isArray(data.playlists)
          ? data.playlists
          : !Array.isArray(data)
            ? data
            : null;

      if (!importedPlaylists) {
        throw new Error("Nenhuma playlist válida encontrada no arquivo.");
      }

      let importedCount = 0;
      for (const [name, tracks] of Object.entries(importedPlaylists)) {
        const cleanName = String(name || "").trim();
        if (!cleanName || !Array.isArray(tracks)) continue;
        const cleanTracks = tracks.map((t) => String(t)).filter(Boolean);
        const existing = Array.isArray(playlists[cleanName]) ? playlists[cleanName] : [];
        playlists[cleanName] = [...new Set([...existing, ...cleanTracks])];
        importedCount++;
      }

      let favCount = 0;
      if (Array.isArray(data.favorites)) {
        data.favorites.forEach((f) => {
          const item = String(f || "").trim();
          if (item && !favorites.has(item)) {
            favorites.add(item);
            favCount++;
          }
        });
      }

      if (importedCount === 0 && favCount === 0) {
        throw new Error("O arquivo não contém playlists ou favoritos para importar.");
      }

      savePlaylists();
      saveFavorites();
      refreshPlaylistUIControls();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
      setStatus(`Importado: ${importedCount} playlist(s) e ${favCount} favorito(s).`);
    }

    function setPlayIcon(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    function setRepeatIcon(mode) {
      if (mode === "one") {
        repeatIcon.innerHTML =
          '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2v-4h-1l-1 .5v1h1V15h1z"/>';
      } else {
        repeatIcon.innerHTML =
          '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
      }
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function formatTitleFromFilename(filename) {
      return filename
        .replace(/\.(mp3|ogg|wav|m4a|flac)$/i, "")
        .replace(/[-_]+/g, " ")
        .trim();
    }

    function resolveAudioSrc(track) {
      if (track.src) return track.src;
      const base = MUSIC_FOLDER.endsWith("/") ? MUSIC_FOLDER : `${MUSIC_FOLDER}/`;
      return `${base}${encodeURIComponent(track.file || "")}`;
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "0:00";
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function refreshPlaylistUIControls() {
      const names = Object.keys(playlists);
      if (selectedPlaylistName && !playlists[selectedPlaylistName]) {
        selectedPlaylistName = "";
      }

      activePlaylistSelect.innerHTML = '<option value="">Sem playlist ativa</option>';
      names.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        if (name === selectedPlaylistName) opt.selected = true;
        activePlaylistSelect.appendChild(opt);
      });

      [...viewTabsEl.querySelectorAll('[data-view^="playlist:"]')].forEach((el) => el.remove());
      names.forEach((name) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn";
        btn.dataset.view = `playlist:${name}`;
        btn.textContent = name;
        if (currentView === `playlist:${name}`) btn.classList.add("active");
        btn.addEventListener("click", () => setView(`playlist:${name}`));
        viewTabsEl.appendChild(btn);
      });

      [...viewTabsEl.querySelectorAll('[data-view="all"], [data-view="favorites"]')].forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === currentView);
      });
    }

    function getLeadingNumber(text) {
      const match = String(text || "").trim().match(/^(\d+)/);
      return match ? Number(match[1]) : null;
    }

    function sortTrackList(list, mode) {
      if (mode === "default") return list;
      const copy = [...list];

      if (mode === "alpha") {
        copy.sort((a, b) =>
          (a.title || a.file || "").localeCompare(b.title || b.file || "", "pt-BR", {
            sensitivity: "base"
          })
        );
        return copy;
      }

      if (mode === "numeric") {
        copy.sort((a, b) => {
          const titleA = a.title || a.file || "";
          const titleB = b.title || b.file || "";
          const numA = getLeadingNumber(titleA);
          const numB = getLeadingNumber(titleB);

          if (numA !== null && numB !== null) {
            if (numA !== numB) return numA - numB;
            return titleA.localeCompare(titleB, "pt-BR", { sensitivity: "base" });
          }
          if (numA !== null) return -1;
          if (numB !== null) return 1;
          return titleA.localeCompare(titleB, "pt-BR", { sensitivity: "base" });
        });
        return copy;
      }

      return copy;
    }

    function computeVisibleTracks() {
      let base = allTracks;

      if (currentView === "favorites") {
        base = base.filter((t) => favorites.has(t.file));
      } else if (currentView.startsWith("playlist:")) {
        const plName = currentView.slice("playlist:".length);
        const list = playlists[plName] || [];
        const set = new Set(list);
        base = base.filter((t) => set.has(t.file));
      }

      const q = searchQuery.trim().toLowerCase();
      if (q) {
        base = base.filter(
          (t) =>
            (t.title || "").toLowerCase().includes(q) ||
            (t.file || "").toLowerCase().includes(q)
        );
      }

      return sortTrackList(base, sortMode);
    }

    function buildQueue(keepFile = null) {
      const indices = visibleTracks.map((_, i) => i);
      if (isShuffle) {
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
      }
      queue = indices;
      if (keepFile) {
        const pos = queue.findIndex((idx) => visibleTracks[idx].file === keepFile);
        currentIndex = pos >= 0 ? pos : 0;
      } else {
        currentIndex = 0;
      }
    }

    function currentTrack() {
      if (!queue.length || !visibleTracks.length) return null;
      return visibleTracks[queue[currentIndex]] || null;
    }

    function updateMediaSession(track) {
      if (!("mediaSession" in navigator) || !track) return;
      const artUrl = track.cover ? new URL(track.cover, window.location.href).href : placeholderCover;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.artist,
        album: track.album || "",
        artwork: [{ src: artUrl, sizes: "120x120", type: "image/svg+xml" }]
      });
      navigator.mediaSession.setActionHandler("play", () => audio.play().catch(() => {}));
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("previoustrack", () => playPrev());
      navigator.mediaSession.setActionHandler("nexttrack", () => playNext(false));
    }

    function toggleFavorite(filename) {
      if (favorites.has(filename)) {
        favorites.delete(filename);
      } else {
        favorites.add(filename);
      }
      saveFavorites();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    }

    function toggleTrackInSelectedPlaylist(filename) {
      if (!selectedPlaylistName || !playlists[selectedPlaylistName]) {
        setStatus("Crie ou selecione uma playlist ao lado antes de adicionar faixas.");
        return;
      }
      const list = playlists[selectedPlaylistName];
      const idx = list.indexOf(filename);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.push(filename);
      }
      savePlaylists();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    }

    function playTrackFromList(idx) {
      const target = visibleTracks[idx];
      if (!target) return;

      consecutiveErrorSkips = 0;

      if (activePlayingFile === target.file && audio.getAttribute("src")) {
        togglePlay();
        return;
      }

      const qPos = queue.indexOf(idx);
      if (qPos >= 0) {
        currentIndex = qPos;
        loadTrack(true);
      }
    }

    function renderPlaylist() {
      const activeFile = activePlayingFile || currentTrack()?.file || null;
      playlistEl.innerHTML = "";

      if (!visibleTracks.length) {
        const empty = document.createElement("li");
        empty.className = "empty-msg";
        empty.textContent = "Nenhuma faixa encontrada neste filtro.";
        playlistEl.appendChild(empty);
        return;
      }

      const activePlSet = new Set(
        selectedPlaylistName && playlists[selectedPlaylistName] ? playlists[selectedPlaylistName] : []
      );

      visibleTracks.forEach((track, idx) => {
        const li = document.createElement("li");
        const isCurrent = activeFile && track.file === activeFile;
        const isThisPlaying = isCurrent && !audio.paused && Boolean(audio.getAttribute("src"));
        if (isCurrent) li.classList.add("active");

        const infoArea = document.createElement("div");
        infoArea.className = "track-info-area";

        const titleSpan = document.createElement("span");
        titleSpan.className = "track-title";
        titleSpan.textContent = track.title;

        infoArea.appendChild(titleSpan);

        if (isCurrent) {
          const badge = document.createElement("span");
          badge.className = "now-badge";
          badge.textContent = isThisPlaying ? "● Tocando" : "❚❚ Pausado";
          infoArea.appendChild(badge);
        }

        const actions = document.createElement("div");
        actions.className = "track-actions";

        const playTrackBtn = document.createElement("button");
        playTrackBtn.type = "button";
        playTrackBtn.className = `play-track-btn${isThisPlaying ? " is-playing" : ""}`;
        playTrackBtn.title = isThisPlaying ? "Pausar faixa" : "Tocar faixa";
        playTrackBtn.setAttribute("aria-label", isThisPlaying ? `Pausar ${track.title}` : `Tocar ${track.title}`);
        playTrackBtn.textContent = isThisPlaying ? "⏸ Pausar" : "▶ Tocar";
        playTrackBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          playTrackFromList(idx);
        });

        const isFav = favorites.has(track.file);
        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = `fav-btn${isFav ? " is-fav" : ""}`;
        favBtn.title = isFav ? "Remover dos favoritos" : "Favoritar";
        favBtn.setAttribute("aria-label", isFav ? "Remover dos favoritos" : "Favoritar");
        favBtn.textContent = isFav ? "♥" : "♡";
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(track.file);
        });

        const addPlBtn = document.createElement("button");
        addPlBtn.type = "button";
        const inPl = activePlSet.has(track.file);
        addPlBtn.className = `add-pl-btn${inPl ? " in-pl" : ""}`;
        addPlBtn.title = selectedPlaylistName
          ? inPl
            ? `Remover de "${selectedPlaylistName}"`
            : `Adicionar a "${selectedPlaylistName}"`
          : "Selecione uma playlist primeiro";
        addPlBtn.textContent = inPl ? "✓ Playlist" : "+ Playlist";
        addPlBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleTrackInSelectedPlaylist(track.file);
        });

        actions.append(playTrackBtn, favBtn, addPlBtn);
        li.append(infoArea, actions);
        playlistEl.appendChild(li);
      });
    }

    function applyFilters(keepFile = null, autoPlayIfChanged = false) {
      const hasActiveAudio = Boolean(audio.getAttribute("src"));
      const wasPlaying = hasActiveAudio && !audio.paused;
      const prevSrc = audio.getAttribute("src") || "";

      visibleTracks = computeVisibleTracks();
      buildQueue(keepFile);

      if (!visibleTracks.length) {
        renderPlaylist();
        return;
      }

      const track = currentTrack();
      if (!track) {
        renderPlaylist();
        return;
      }

      const nextSrc = resolveAudioSrc(track);
      const isSameTrackAlreadyLoaded = hasActiveAudio && prevSrc === nextSrc && track.file === activePlayingFile;

      renderPlaylist();

      if (!isSameTrackAlreadyLoaded) {
        const shouldAutoPlay = autoPlayIfChanged || (wasPlaying && !keepFile);
        loadTrack(shouldAutoPlay);
      }
    }

    function setView(viewName) {
      currentView = viewName;
      refreshPlaylistUIControls();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    }

    function loadTrack(autoPlay = false) {
      const track = currentTrack();
      if (!track) return;

      setStatus("");
      activePlayingFile = track.file;
      audio.src = resolveAudioSrc(track);
      titleEl.textContent = track.title;
      artistEl.textContent = track.artist;
      coverEl.src = track.cover || placeholderCover;
      seekEl.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      updateMediaSession(track);
      renderPlaylist();

      if (autoPlay) {
        audio.play().catch(() => setStatus("Clique no botão Play para iniciar a reprodução."));
      }
    }

    function togglePlay() {
      consecutiveErrorSkips = 0;
      if (!audio.getAttribute("src")) {
        if (currentTrack()) loadTrack(true);
        return;
      }
      if (audio.paused) {
        audio.play().catch(() => setStatus("Erro ao iniciar o áudio."));
      } else {
        audio.pause();
      }
    }

    function playNext(fromEnded = false, fromError = false) {
      if (!queue.length) return;
      if (!fromError) consecutiveErrorSkips = 0;

      if (fromEnded && repeatMode === "one") {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        return;
      }
      if (currentIndex + 1 < queue.length) {
        currentIndex++;
        loadTrack(true);
      } else {
        currentIndex = 0;
        loadTrack(true);
      }
    }

    function playPrev() {
      consecutiveErrorSkips = 0;
      if (!queue.length) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      currentIndex = (currentIndex - 1 + queue.length) % queue.length;
      loadTrack(true);
    }

    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value;
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    });

    sortSelect.addEventListener("change", () => {
      sortMode = sortSelect.value;
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    });

    [...viewTabsEl.querySelectorAll('[data-view="all"], [data-view="favorites"]')].forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });

    createPlaylistBtn.addEventListener("click", () => {
      const name = (newPlaylistInput.value || "").trim();
      if (!name) return;
      if (!playlists[name]) {
        playlists[name] = [];
        savePlaylists();
      }
      selectedPlaylistName = name;
      newPlaylistInput.value = "";
      refreshPlaylistUIControls();
      renderPlaylist();
    });

    activePlaylistSelect.addEventListener("change", () => {
      selectedPlaylistName = activePlaylistSelect.value;
      renderPlaylist();
    });

    renamePlaylistBtn.addEventListener("click", () => {
      if (!selectedPlaylistName || !playlists[selectedPlaylistName]) {
        setStatus("Selecione uma playlist para editar.");
        return;
      }
      const typedName = (newPlaylistInput.value || "").trim();
      const nextName = typedName || (window.prompt("Novo nome da playlist:", selectedPlaylistName) || "").trim();
      if (!nextName || nextName === selectedPlaylistName) return;

      const oldName = selectedPlaylistName;
      const oldTracks = playlists[oldName] || [];
      const mergedTracks = Array.isArray(playlists[nextName])
        ? [...new Set([...playlists[nextName], ...oldTracks])]
        : oldTracks;

      playlists[nextName] = mergedTracks;
      delete playlists[oldName];
      savePlaylists();

      selectedPlaylistName = nextName;
      if (typedName) newPlaylistInput.value = "";
      if (currentView === `playlist:${oldName}`) {
        currentView = `playlist:${nextName}`;
      }

      refreshPlaylistUIControls();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
      setStatus(`Playlist renomeada para "${nextName}".`);
    });

    deletePlaylistBtn.addEventListener("click", () => {
      if (!selectedPlaylistName || !playlists[selectedPlaylistName]) return;
      const nameToDelete = selectedPlaylistName;
      delete playlists[nameToDelete];
      savePlaylists();
      selectedPlaylistName = "";
      if (currentView === `playlist:${nameToDelete}`) {
        currentView = "all";
      }
      refreshPlaylistUIControls();
      applyFilters(activePlayingFile || currentTrack()?.file || null, false);
    });

    exportPlaylistsBtn.addEventListener("click", exportPlaylistsData);
    exportM3uBtn.addEventListener("click", exportAllTracksM3U);

    importPlaylistsBtn.addEventListener("click", () => {
      importPlaylistsFile.value = "";
      importPlaylistsFile.click();
    });

    importPlaylistsFile.addEventListener("change", async () => {
      const file = importPlaylistsFile.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        importPlaylistsFromObject(parsed);
      } catch (err) {
        setStatus(err?.message || "Não foi possível importar o arquivo JSON.");
      }
    });

    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", () => playNext(false));
    prevBtn.addEventListener("click", playPrev);

    shuffleBtn.addEventListener("click", () => {
      const activeFile = activePlayingFile || currentTrack()?.file || null;
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active-mode", isShuffle);
      buildQueue(activeFile);
      renderPlaylist();
    });

    repeatBtn.addEventListener("click", () => {
      const modes = ["none", "all", "one"];
      repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
      repeatBtn.classList.toggle("active-mode", repeatMode !== "none");
      setRepeatIcon(repeatMode);
    });

    volumeEl.addEventListener("input", () => {
      audio.volume = Number(volumeEl.value);
    });

    seekEl.addEventListener("input", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (Number(seekEl.value) / 100) * audio.duration;
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      consecutiveErrorSkips = 0;
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seekEl.value = ((audio.currentTime / audio.duration) * 100).toFixed(2);
      }
    });

    audio.addEventListener("play", () => {
      consecutiveErrorSkips = 0;
      setPlayIcon(true);
      renderPlaylist();
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    });

    audio.addEventListener("pause", () => {
      setPlayIcon(false);
      renderPlaylist();
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    });

    audio.addEventListener("ended", () => playNext(true));

    audio.addEventListener("error", () => {
      if (!audio.getAttribute("src")) return;
      const failedName = currentTrack()?.title || currentTrack()?.file || "faixa";
      consecutiveErrorSkips++;

      if (queue.length > 1 && consecutiveErrorSkips < queue.length) {
        setStatus(`Falha ao carregar "${failedName}". Pulando para a próxima...`);
        setTimeout(() => {
          playNext(false, true);
        }, 450);
      } else {
        setStatus(`Não foi possível carregar "${failedName}" (verifique a rede ou o arquivo).`);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      }
    });

    async function fetchTracksFromGitHub() {
      const cleanPath = REPO_AUDIO_PATH.replace(/^\/+|\/+$/g, "");
      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${cleanPath}?ref=${GITHUB_BRANCH}`;
      const res = await fetch(apiUrl, { cache: "no-store" });
      if (!res.ok) throw new Error("GitHub API indisponível");
      const items = await res.json();
      if (!Array.isArray(items)) throw new Error("Resposta inválida");

      const tracks = items
        .filter((item) => item.type === "file" && /\.(mp3|ogg|wav|m4a|flac)$/i.test(item.name))
        .map((item, i) => ({
          id: `gh-${i}-${item.name}`,
          title: formatTitleFromFilename(item.name),
          artist: "Música",
          album: "",
          file: item.name,
          cover: ""
        }));

      if (tracks.length) writeTracksCache(tracks);
      return tracks;
    }

    async function init() {
      loadSavedLibrary();
      refreshPlaylistUIControls();

      audio.volume = Number(volumeEl.value);
      setPlayIcon(false);
      setRepeatIcon(repeatMode);

      const freshCached = readTracksCache(false);
      if (freshCached) {
        allTracks = freshCached;
        // Atualiza em segundo plano sem travar a abertura
        fetchTracksFromGitHub()
          .then((updated) => {
            if (updated.length && JSON.stringify(updated) !== JSON.stringify(allTracks)) {
              allTracks = updated;
              applyFilters(activePlayingFile || currentTrack()?.file || null, false);
            }
          })
          .catch(() => {});
      } else {
        try {
          allTracks = await fetchTracksFromGitHub();
        } catch (_) {
          const staleCached = readTracksCache(true);
          if (staleCached) {
            allTracks = staleCached;
            setStatus("Sem conexão com a API do GitHub: usando lista em cache.");
          } else {
            const fallback = JSON.parse(document.getElementById("playlist-data").textContent || "[]");
            allTracks = Array.isArray(fallback) ? fallback : [];
          }
        }
      }

      if (!allTracks.length) {
        titleEl.textContent = "Nenhuma faixa encontrada";
        setStatus(`Adicione arquivos .mp3 em /${REPO_AUDIO_PATH}/ no repositório.`);
        return;
      }

      visibleTracks = computeVisibleTracks();
      buildQueue();
      renderPlaylist();
      loadTrack(false);
    }

    init();
  </script>
</body>
</html>
