<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Ataques Cibernéticos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #131722;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
    }
    .btn-group {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
    }
    .btn-external {
      background-color: #1e222d;
      color: #b2b5be;
      border: 1px solid #363a45;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      display: inline-block;
    }
    .btn-external:hover {
      background-color: #2a2e39;
      color: #ffffff;
      border-color: #60a5fa;
    }
    .viewer {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .notice {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(19, 23, 34, 0.9);
      border: 1px solid #2a2e39;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <a class="btn-external" href="https://cybermap.kaspersky.com/pt" target="_blank" rel="noopener noreferrer">Kaspersky Cybermap ↗</a>
      <a class="btn-external" href="https://horizon.netscout.com/" target="_blank" rel="noopener noreferrer">NETSCOUT Horizon ↗</a>
      <a class="btn-external" href="https://www.fortinet.com/br/fortiguard/threat-intelligence/threat-map" target="_blank" rel="noopener noreferrer">Fortinet Threat Map ↗</a>
      <a class="btn-external" href="https://sicherheitstacho.eu/" target="_blank" rel="noopener noreferrer">Sicherheitstacho (Honeypots) ↗</a>
      <a class="btn-external" href="https://livethreatmap.radware.com/" target="_blank" rel="noopener noreferrer">Radware Threat Map ↗</a>
      <a class="btn-external" href="https://www.spamhaus.com/threat-map/" target="_blank" rel="noopener noreferrer">Spamhaus Botnets ↗</a>
    </div>
  </header>

  <div class="viewer">
    <iframe src="https://threatmap.checkpoint.com/" loading="lazy" referrerpolicy="no-referrer" title="Check Point ThreatMap"></iframe>
    <div class="notice">Painel central fixo: Check Point ThreatMap</div>
  </div>

</body>
</html>
