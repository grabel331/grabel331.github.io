  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouça uma Rádio</title>
    
    <!-- CSS do Leaflet e dos Clusters (Sem necessidade de API Key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #111; }
        
        #map { width: 100vw; height: 100vh; }

        /* Player Flutuante Minimalista */
        #player-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 10px 18px;
            border-radius: 40px; display: none; align-items: center; gap: 12px;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(8px);
        }
        #station-info { font-size: 13px; font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #10b981; }
        audio { height: 32px; outline: none; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="player-bar">
        <span id="station-info">Selecione uma rádio</span>
        <audio id="audio-player" controls autoplay></audio>
    </div>

    <!-- Scripts do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Inicializa o mapa centralizado no mundo
        const map = L.map('map', { center: [20, 0], zoom: 3, minZoom: 2 });

        // TDF Totalmente Gratuito (OpenStreetMap - sem API Key)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const markers = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45 });

        const radioIcon = L.divIcon({
            className: 'custom-radio-icon',
            html: `<div style="width:12px; height:12px; background:#10b981; border:2px solid #fff; border-radius:50%; box-shadow:0 0 8px #10b981;"></div>`,
            iconSize: [12, 12]
        });

        // Servidores públicos livres da Radio-Browser
        const apiServers = [
            'https://all.api.radio-browser.info',
            'https://de1.api.radio-browser.info',
            'https://nl1.api.radio-browser.info'
        ];

        async function loadRadios() {
            for (let server of apiServers) {
                try {
                    const res = await fetch(`${server}/json/stations/search?has_geo=true&limit=6000`);
                    if (!res.ok) continue;
                    
                    const stations = await res.json();
                    const markerList = [];

                    stations.forEach(station => {
                        const lat = parseFloat(station.geo_lat);
                        const lng = parseFloat(station.geo_long);

                        if (!isNaN(lat) && !isNaN(lng)) {
                            const marker = L.marker([lat, lng], { icon: radioIcon });
                            
                            marker.on('click', () => {
                                const streamUrl = station.url_resolved || station.url;
                                if (streamUrl) {
                                    document.getElementById('station-info').innerText = station.name;
                                    const audio = document.getElementById('audio-player');
                                    audio.src = streamUrl;
                                    document.getElementById('player-bar').style.display = 'flex';
                                }
                            });

                            marker.bindTooltip(`<b>${station.name}</b><br>${station.country || ''}`, { direction: 'top' });
                            markerList.push(marker);
                        }
                    });

                    markers.addLayers(markerList);
                    map.addLayer(markers);
                    break;
                } catch (e) {
                    console.warn(`Tentando próximo servidor...`);
                }
            }
        }

        loadRadios();
    </script>


</body>


  
</html>
