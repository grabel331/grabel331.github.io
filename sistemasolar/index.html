<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Scope</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

iframe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Botão de Página Inicial (Posicionado no canto superior direito) */
.continent-selector {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 9999;
}

.continent-btn {
  display: inline-block;
  padding: 10px 15px;
  background: #111c;
  color: white;
  border: 1px solid #777;
  border-radius: 6px;
  text-decoration: none;
  font-family: sans-serif;
  font-size: 14px;
}

.continent-btn:hover {
  background: #222c;
}
</style>
</head>

<body>

<!-- Botão de Página Inicial -->
<div class="continent-selector">
  <a href="https://www.gabrielpereira.net.eu.org" class="continent-btn">🏠 Página inicial</a>
</div>

<!-- Iframe do Solar System Scope -->
<iframe
  id="solarsystem"
  src="https://www.solarsystemscope.com/iframe"
  title="Solar System Scope - Modelo Interativo"
  allowfullscreen>
</iframe>

</body>
</html>
