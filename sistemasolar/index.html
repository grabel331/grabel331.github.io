<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Scope</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* Container que força a escala de computador em telas menores */
.desktop-wrapper {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: auto; /* Permite navegar caso o site fique maior que a tela do celular */
  background: #000;
}

/* Força o iframe a ter o tamanho padrão de um monitor de PC (1280x720 ou maior) */
iframe {
  width: 1280px;
  height: 720px;
  min-width: 100%;
  min-height: 100%;
  border: none;
  transform-origin: top left;
}

/* Botões de Navegação (Posicionados à esquerda e flutuantes) */
.continent-selector {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  display: flex;
  gap: 8px;
}

.continent-btn {
  display: inline-block;
  padding: 8px 12px;
  background-color: rgba(17, 17, 17, 0.85);
  color: white;
  border: 1px solid #777;
  border-radius: 6px;
  text-decoration: none;
  font-family: sans-serif;
  font-size: 13px;
  white-space: nowrap;
}

.continent-btn:hover {
  background: rgba(34, 34, 34, 0.9);
}
</style>
</head>

<body>

<!-- Botões de Navegação -->
<div class="continent-selector">
  <a href="https://play.google.com/store/apps/details?id=com.inzania.solarsystemscope" target="_blank" class="continent-btn">📱 APP (Play Store)</a>
  <a href="https://www.gabrielpereira.net.eu.org" class="continent-btn">🏠 Página inicial</a>
</div>

<!-- Wrapper para forçar o layout de desktop sem exigir que o usuário mude nada -->
<div class="desktop-wrapper">
  <iframe
    id="solarsystem"
    src="https://www.solarsystemscope.com/iframe"
    title="Solar System Scope - Modelo Interativo"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
