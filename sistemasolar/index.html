<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Scope</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

iframe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Botões de Navegação (Posicionados à esquerda e responsivos para celular) */
.continent-selector {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  display: flex;
  gap: 8px;
  max-width: calc(100vw - 24px);
  flex-wrap: wrap; /* Permite quebrar linha caso a tela seja muito pequena */
}

.continent-btn {
  display: inline-block;
  padding: 8px 12px; /* Ligeiramente menor para adaptar melhor ao mobile */
  background: #111ccb; /* Mantém o estilo semi-transparente escuro */
  background-color: rgba(17, 17, 17, 0.85);
  color: white;
  border: 1px solid #777;
  border-radius: 6px;
  text-decoration: none;
  font-family: sans-serif;
  font-size: 13px; /* Fonte ajustada para celular */
  white-space: nowrap; /* Evita que o texto quebre no meio de uma palavra */
}

.continent-btn:hover {
  background: rgba(34, 34, 34, 0.9);
}

/* Ajuste extra para telas muito pequenas (smartphones na vertical) */
@media (max-width: 480px) {
  .continent-btn {
    padding: 6px 10px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<!-- Botões de Navegação -->
<div class="continent-selector">
  <a href="https://play.google.com/store/apps/details?id=com.inzania.solarsystemscope" target="_blank" class="continent-btn">📱 APP (Play Store)</a>
  <a href="https://www.gabrielpereira.net.eu.org" class="continent-btn">🏠 Página inicial</a>
</div>

<!-- Iframe do Solar System Scope -->
<iframe
  id="solarsystem"
  src="https://www.solarsystemscope.com/iframe"
  title="Solar System Scope - Modelo Interativo"
  allowfullscreen>
</iframe>

</body>
</html>
